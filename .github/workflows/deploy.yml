name: Deploy PHP para Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar no servidor e atualizar os arquivos
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CIRCUITO_HOST }}
          username: ${{ secrets.CIRCUITO_USER }}
          port: 22
          password: ${{ secrets.CIRCUITO_SENHA }}
          script_stop: true
          script: |
            set -eu
            cd /home/${{ secrets.CIRCUITO_USER }}/www/
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git branch --show-current
            git log -1 --format='%h %s'
